services:
  # Local real-mode database (`pnpm db:local`); deploys use Neon instead.
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fastdeploy
      POSTGRES_PASSWORD: fastdeploy
      POSTGRES_DB: fastdeploy
    ports: ["5433:5432"]
    volumes: ["fastdeploy-db:/var/lib/postgresql/data"]

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: https://api.example.com
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: https://api.example.com
      NEXT_PUBLIC_API_MOCKING: "disabled"

volumes:
  fastdeploy-db:
