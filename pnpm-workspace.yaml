# pnpm blocks dependency build scripts by default. sharp (Next.js image
# optimization) ships a native binary built via a postinstall script, so allow it.
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js: true
  cpu-features: true
  esbuild: true
  msw: true
  protobufjs: true
  sharp: true
  ssh2: true
